function setTheme(isDark) {
    document.body.classList.toggle('dark', isDark);
    themeToggle.setAttribute('aria-pressed', String(isDark));
    themeToggle.setAttribute('aria-label', isDark ? 'Ativar modo claro' : 'Ativar modo escuro');
    themeToggle.querySelector('span').textContent = isDark ? '☀' : '☾';

function loadTheme() {
    setTheme(readStorage(THEME_KEY) === 'dark');
}
function readStorage(key) {
    try {
        return localStorage.getItem(key);
    } catch (error) {
        console.warn('Não foi possível ler as preferências locais.', error);
        return null;
    }
}
function writeStorage(key, value) {
    try {
        localStorage.setItem(key, value);
    } catch (error) {
        console.warn('Não foi possível salvar as preferências locais.', error);
    }
}
function openAudioDatabase() {
    if (!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB não está disponível neste navegador.'));
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(AUDIO_DB_NAME, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(AUDIO_STORE_NAME);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}
async function readCachedAudio(key) {
    const database = await openAudioDatabase();
    return new Promise((resolve, reject) => {
        const request = database.transaction(AUDIO_STORE_NAME, 'readonly').objectStore(AUDIO_STORE_NAME).get(key);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
    });
}
async function writeCachedAudio(key, data) {
    const database = await openAudioDatabase();
    return new Promise((resolve, reject) => {
        const transaction = database.transaction(AUDIO_STORE_NAME, 'readwrite');
        transaction.objectStore(AUDIO_STORE_NAME).put(data, key);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
    });
}
async function requestPersistentStorage() {
    if (!navigator.storage) return { available: false, persistent: false };
    let persistent = false;
    if (navigator.storage.persisted) persistent = await navigator.storage.persisted();
    if (!persistent && navigator.storage.persist) persistent = await navigator.storage.persist();
    return { available: true, persistent };
}
async function loadAudioData(path) {
    const key = `${AUDIO_CACHE_VERSION}:${path}`;
    if (!audioLoadPromises.has(key)) {
        const loadPromise = (async () => {
            try {
                const cached = await readCachedAudio(key);
                if (cached) return cached;
            } catch (error) {
                console.warn('Não foi possível ler o cache de áudio.', error);
            }
            const response = await fetch(path);
            if (!response.ok) throw new Error(`Não foi possível carregar ${path} (${response.status}).`);
            const data = await response.arrayBuffer();
            try {
                await writeCachedAudio(key, data);
            } catch (error) {
                console.warn('Não foi possível salvar o áudio no cache persistente.', error);
            }
            return data;
        })();
        audioLoadPromises.set(key, loadPromise);
        loadPromise.catch(() => {
            if (audioLoadPromises.get(key) === loadPromise) audioLoadPromises.delete(key);
        });
    }
    return audioLoadPromises.get(key);
}

function availableOctaves(instrument) {
    const [, min, max] = INSTRUMENTS[instrument];
    return Array.from({ length: OCTAVE_COUNT }, (_, index) => index + 1).filter(octave => {
        const firstMidi = (octave + 1) * 12;
        return firstMidi <= max && firstMidi + 11 >= min;
    });
}
function orderedOctaves(instrument) {
    const octaves = availableOctaves(instrument);
    const center = Math.floor((octaves.length - 1) / 2);
    return octaves.flatMap((_, offset) => {
        const indexes = offset === 0 ? [center] : [center - offset, center + offset];
        return indexes.filter(index => index >= 0 && index < octaves.length).map(index => octaves[index]);
    });
}

            };
        }).filter(({ progression, outside, octaves: selectedOctaves }) => {
            return availableNotes(progression, selectedOctaves, instrument).length &&
                (!outside.length || availableNotes(outside, selectedOctaves, instrument).length);
        });
        return phasesInLevel.map((phaseData, phaseIndex) => ({
            ...phaseData, phaseNumber: phaseIndex + 1, phaseCount: phasesInLevel.length

    });
}
function loadProgress() {
    const saved = Number(readStorage(`${PROGRESS_KEY}${selectedInstrument}`));
    const lastPhase = Math.max(0, currentPhases.length - 1);
    highestUnlockedPhase = Number.isInteger(saved) ? Math.min(Math.max(saved, 0), lastPhase) : 0;
    phaseIndex = Math.min(highestUnlockedPhase, lastPhase);
}
function saveProgress() {
    writeStorage(`${PROGRESS_KEY}${selectedInstrument}`, String(highestUnlockedPhase));
}
function renderPhaseOptions() {
    phaseSelect.innerHTML = currentPhases.map((phase, index) => {
        const locked = index > highestUnlockedPhase;
        return `<option value="${index}" ${index === phaseIndex ? 'selected' : ''} ${locked ? 'disabled' : ''}>Nível ${phase.difficultyIndex + 1} · Fase ${phase.phaseNumber}${locked ? ' (bloqueada)' : ''}</option>`;
    }).join('');
}
function formatOctaves(octaves) {
    return `${octaves.length === 1 ? 'Oitava:' : 'Oitavas'} ${octaves.join(', ')}`;
}
function updatePhaseInfo() {
    const phase = currentPhases[phaseIndex];
    if (!phase) {
        phaseInfo.textContent = 'Nenhuma fase disponível para este instrumento.';
        return;
    }
    phaseInfo.innerHTML = `<span class="phase-detail">Contidos: ${phase.progression.join(', ') || 'nenhuma'}</span><span class="phase-detail">Não Contidos: ${phase.outside.join(', ') || 'nenhuma'}</span><span class="phase-octaves">${formatOctaves(phase.octaves)}</span>`;
}
function shuffle(values) {
    for (let index = values.length - 1; index > 0; index--) {
        const swapIndex = randomInt(index + 1);
        [values[index], values[swapIndex]] = [values[swapIndex], values[index]];
    }
    return values;
}
function midiDetails(midi) {
    return { pitchClass: NOTES[midi % 12], octave: Math.floor((midi - 12) / 12) };
}
function noteToMidi(name) {
    const match = name.match(/^([A-G])s?(\d)$/); if (!match) return null;
    return (Number(match[2]) + 1) * 12 + NOTE_TO_MIDI[match[1]] + (name.includes('s') ? 1 : 0);
}
function randomUint32() {
    if (!window.crypto?.getRandomValues) throw new Error('Seu navegador não oferece aleatoriedade segura.');
    const values = new Uint32Array(1);
    window.crypto.getRandomValues(values);
    return values[0];
}
function randomInt(maxExclusive) {
    if (!Number.isInteger(maxExclusive) || maxExclusive <= 0 || maxExclusive > 0x100000000) {
        throw new RangeError('O limite da aleatoriedade deve ser um inteiro positivo válido.');
    }
    const limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
    let value;
    do value = randomUint32(); while (value >= limit);
    return value % maxExclusive;
}
function randomFraction() {
    return randomUint32() / 0x100000000;
}
function sampleMap(instrument) {
    if (!sampleMaps[instrument]) {
        sampleMaps[instrument] = SAMPLES[instrument].split(' ').reduce((map, name) => {
            map[noteToMidi(name)] = name;
            return map;
        }, {});
        sampleCandidates[instrument] = Object.keys(sampleMaps[instrument]).map(Number);
    }
    return sampleMaps[instrument];
}
function playableMidi(midi, instrument) { const [, min, max] = INSTRUMENTS[instrument]; return midi >= min && midi <= max; }
function nearestSampleName(midi, instrument) {
    const map = sampleMap(instrument);
    const nearest = sampleCandidates[instrument].reduce((closest, candidate) => {
        return Math.abs(midi - candidate) < Math.abs(midi - closest) ? candidate : closest;
    });
    return map[nearest];
}
async function getBuffer(midi, instrument) {
    if (location.protocol === 'file:') throw new Error('Abra o site por um servidor local para carregar os samples.');
    audioBuffers[instrument] ||= {};
    audioBufferPromises[instrument] ||= {};
    const sampleName = nearestSampleName(midi, instrument);
    const sampleMidi = noteToMidi(sampleName);
    if (!audioBuffers[instrument][sampleName] && !audioBufferPromises[instrument][sampleName]) {
        const loadPromise = (async () => {
            const decoded = await audioContext.decodeAudioData(await loadAudioData(`./Samples/${instrument}/${sampleName}.wav`));
            const mono = audioContext.createBuffer(1, decoded.length, decoded.sampleRate);
            const output = mono.getChannelData(0);
            for (let channel = 0; channel < decoded.numberOfChannels; channel++) {
                const input = decoded.getChannelData(channel);
                for (let index = 0; index < decoded.length; index++) output[index] += input[index] / decoded.numberOfChannels;
            }
            audioBuffers[instrument][sampleName] = mono;
            return mono;
        })();
        audioBufferPromises[instrument][sampleName] = loadPromise;
        loadPromise.catch(() => {
            if (audioBufferPromises[instrument][sampleName] === loadPromise) {
                delete audioBufferPromises[instrument][sampleName];
            }
        });
    }
    const buffer = audioBuffers[instrument][sampleName] || await audioBufferPromises[instrument][sampleName];
    return { buffer, semitoneDiff: midi - sampleMidi };
}
async function initAudio() {
    const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextConstructor) throw new Error('Seu navegador não oferece suporte a áudio.');
    if (!audioContext || audioContext.state === 'closed') audioContext = new AudioContextConstructor();
    if (audioContext.state === 'suspended') await audioContext.resume();
    if (audioContext.state !== 'running') {
        throw new Error('O áudio está bloqueado. Toque ou clique em “Iniciar fase” para permitir a reprodução.');
    }
}
async function playEffectSound(filename) {
    await initAudio();
    await preloadEffectSound(filename);
    const source = audioContext.createBufferSource();
    source.buffer = effectBuffers[filename];
    source.connect(audioContext.destination);
    source.start();
}
async function preloadEffectSound(filename) {
    if (effectBuffers[filename]) return;
    if (!effectLoadPromises.has(filename)) {
        const loadPromise = loadAudioData(`./Samples/${filename}`)
            .then(data => audioContext.decodeAudioData(data))
            .then(buffer => { effectBuffers[filename] = buffer; });
        effectLoadPromises.set(filename, loadPromise);
        loadPromise.catch(() => {
            if (effectLoadPromises.get(filename) === loadPromise) effectLoadPromises.delete(filename);
        });
    }
    await effectLoadPromises.get(filename);
}
function playClickSound() {
    playEffectSound('Click.mp3').catch(error => console.error(error));
}
function playShepardTone() {
    const start = audioContext.currentTime + .04;
    const duration = SHEPARD_DURATION;
    let shepardNote;
    do {
        shepardNote = randomInt(12);
    } while (shepardNote === lastShepardNote);
    lastShepardNote = shepardNote;
    const baseFrequency = 130.81 * 2 ** (shepardNote / 12);
    const master = audioContext.createGain();
    master.gain.setValueAtTime(.28, start);
    master.connect(audioContext.destination);
    shepardSources = [];

    for (let octave = 0; octave < 5; octave++) {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const lowFrequency = baseFrequency * 2 ** octave;
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(lowFrequency, start);
        oscillator.frequency.exponentialRampToValueAtTime(lowFrequency * 2, start + duration);
        gain.gain.setValueAtTime(octave === 0 || octave === 4 ? .035 : .075, start);
        oscillator.connect(gain).connect(master);
        oscillator.start(start);
        oscillator.stop(start + duration + .05);
        shepardSources.push(oscillator);
    }
    return new Promise(resolve => setTimeout(() => {
        shepardSources = [];
        resolve();
    }, duration * 1000));
}
function availableNotes(notes, octaves, instrument) {
    const key = `${instrument}|${octaves.join(',')}|${notes.join(',')}`;
    if (notePoolCache.has(key)) return notePoolCache.get(key);
    const pool = Array.from({ length: LAST_MIDI - FIRST_MIDI + 1 }, (_, index) => index + FIRST_MIDI).filter(midi => {
        const details = midiDetails(midi); return octaves.includes(details.octave) && notes.includes(details.pitchClass) && playableMidi(midi, instrument);
    });
    notePoolCache.set(key, pool);
    return pool;
}
function randomNoteByOctave(pool) {
    const notesByOctave = new Map();
    pool.forEach(midi => {
        const octave = midiDetails(midi).octave;
        const notes = notesByOctave.get(octave) || [];
        notes.push(midi);
        notesByOctave.set(octave, notes);
    });
    const octaves = [...notesByOctave.values()];
    const notes = octaves[randomInt(octaves.length)];
    return notes[randomInt(notes.length)];
}
function createSequence() {
    const { progression, outside, octaves: selectedOctaves } = currentPhases[phaseIndex];
    const valid = availableNotes(progression, selectedOctaves, selectedInstrument);
    const out = availableNotes(outside, selectedOctaves, selectedInstrument);
    if (!valid.length || (outside.length && !out.length)) throw new Error('A combinação escolhida não possui samples disponíveis para esta fase.');
    const targets = outside.length
        ? [...Array(HALF_ROUND).fill('valid'), ...Array(HALF_ROUND).fill('outside')]
        : Array(ROUND_SIZE).fill('valid');
    return shuffle(targets).map(type => {
        const pool = type === 'valid' ? valid : out;
        return { midi: randomNoteByOctave(pool), outside: type === 'outside' };
    });
}
async function preloadPhaseAudio() {
    const { progression, outside, octaves } = currentPhases[phaseIndex];
    const notes = [...progression, ...outside];
    const sampleNames = new Set();
    for (const note of notes) {
        const pool = availableNotes([note], octaves, selectedInstrument);
        for (const midi of pool) {
            sampleNames.add(nearestSampleName(midi, selectedInstrument));
        }
    }
    await Promise.all([...sampleNames].map(sampleName => getBuffer(noteToMidi(sampleName), selectedInstrument)));
}
function timerColor(progress) {
    const greenToYellow = progress >= .5;
    const start = greenToYellow ? [0, 200, 83] : [255, 214, 0];
    const end = greenToYellow ? [255, 214, 0] : [255, 23, 68];
    const amount = greenToYellow ? (1 - progress) * 2 : 1 - progress * 2;
    const channels = start.map((channel, index) => Math.round(channel + (end[index] - channel) * amount));
    return `rgb(${channels.join(', ')})`;
}
function showConfetti() {
    const colors = ['#00c853', '#ffd600', '#ff1744', '#2979ff', '#d500f9'];
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.setAttribute('aria-hidden', 'true');
    for (let index = 0; index < 80; index++) {
        const piece = document.createElement('span');
        piece.className = 'confetti-piece';
        piece.style.left = `${randomFraction() * 100}%`;
        piece.style.setProperty('--confetti-color', colors[index % colors.length]);
        piece.style.setProperty('--confetti-duration', `${2.2 + randomFraction() * 1.4}s`);
        piece.style.setProperty('--confetti-delay', `${randomFraction() * .35}s`);
        piece.style.setProperty('--confetti-drift', `${(randomFraction() - .5) * 180}px`);
        piece.style.setProperty('--confetti-spin', `${360 + randomFraction() * 720}deg`);
        confetti.appendChild(piece);
    }
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 4200);
}
async function playNext() {
    if (currentIndex >= sequence.length) return finish();
    cancelAnimationFrame(timerId);
    timer.classList.remove('active');
    const target = sequence[currentIndex++];
    const details = midiDetails(target.midi);
    expectedKey = target.outside ? 'g' : KEY_BY_NOTE[details.pitchClass];
    status.innerHTML = `<div class="status-line">Nota ${currentIndex} / ${ROUND_SIZE}</div>`;
    try {
        const sample = await getBuffer(target.midi, selectedInstrument);
        currentSource = audioContext.createBufferSource();
        const gain = audioContext.createGain();
        currentSource.buffer = sample.buffer;
        currentSource.playbackRate.value = 2 ** (sample.semitoneDiff / 12);
        const start = audioContext.currentTime;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(1, start + NOTE_ATTACK);
        gain.gain.exponentialRampToValueAtTime(.001, start + 2);
        currentSource.connect(gain).connect(audioContext.destination);
        currentSource.start();
    } catch (error) { finish(error); return; }
    waiting = true; timer.classList.add('active');
    timer.style.setProperty('--timer-progress', '100%');
    timer.style.setProperty('--timer-color', timerColor(1));
    const started = performance.now();
    roundDeadline = started + RESPONSE_TIME;
    function tick() {
        const remaining = Math.max(0, RESPONSE_TIME - (performance.now() - started));
        const progress = remaining / RESPONSE_TIME;
        timer.style.setProperty('--timer-progress', `${progress * 100}%`);
        timer.style.setProperty('--timer-color', timerColor(progress));
        if (remaining) timerId = requestAnimationFrame(tick); else processAnswer(null);
    }
    timerId = requestAnimationFrame(tick);
}
function processAnswer(key) {
    if (!waiting || (key !== null && !activeAnswerKeys.has(key))) return;
    waiting = false;
    if (key !== null && key === expectedKey) correct++;
    if (key === null) {
        playNext();
        return;
    }
    cancelAnimationFrame(timerId);
    timer.classList.remove('active');
    nextRoundTimer = setTimeout(playNext, Math.max(0, roundDeadline - performance.now()));
}
function finish(error) {
    waiting = false; expectedKey = null; cancelAnimationFrame(timerId); clearTimeout(nextRoundTimer);
    timer.classList.remove('active'); startButton.disabled = false; phaseSelect.disabled = false; answers.classList.remove('active');
    instrumentSelection.disabled = false;
    starting = false;
    activeAnswerKeys.clear();
    shepardSources.forEach(source => { try { source.stop(); } catch (_) {} });
    shepardSources = [];
    if (currentSource) { try { currentSource.stop(); } catch (_) {} currentSource = null; }
    if (error) {
        const errorMessage = document.createElement('div');
        errorMessage.className = 'error';
        errorMessage.textContent = error instanceof Error ? error.message : 'Ocorreu um erro ao iniciar a fase.';
        status.replaceChildren(errorMessage);
        return;
    }
    const percentage = Math.round(correct / ROUND_SIZE * 100);
    const summary = `<table class="result-summary" aria-label="Resultado da fase"><tbody><tr><td><strong>Acertos</strong><span>${correct}</span></td><td><strong>Total</strong><span>${ROUND_SIZE}</span></td><td><strong>Porcentagem</strong><span>${percentage}%</span></td></tr></tbody></table>`;
    if (correct >= PASS_SCORE) {
        showConfetti();
        playEffectSound('LevelUp.mp3').catch(error => console.error(error));
        if (phaseIndex === highestUnlockedPhase && highestUnlockedPhase < currentPhases.length - 1) {
            highestUnlockedPhase++;
            saveProgress();
            phaseIndex = highestUnlockedPhase;
            renderPhaseOptions();
            updatePhaseInfo();
            renderAnswers();
            const nextPhase = currentPhases[phaseIndex];
            status.innerHTML = `<div class="result">${summary}Fase concluída. Você pode avançar para o Nível ${nextPhase.difficultyIndex + 1}: Fase ${nextPhase.phaseNumber}.</div>`;
        } else if (phaseIndex === currentPhases.length - 1) {
            saveProgress();
            status.innerHTML = `<div class="result">${summary}Parabéns! Você concluiu todas as fases.</div>`;
        } else {
            status.innerHTML = `<div class="result">${summary}Fase concluída. Você pode avançar para a próxima fase.</div>`;
        }
        return;
    }
    status.innerHTML = `<div class="result">${summary}Você precisa de ${PASS_SCORE} acertos para avançar. Tente a fase novamente.</div>`;
}
async function startGame() {
    if (starting || startButton.disabled) return;
    starting = true;
    startButton.disabled = true;
    phaseSelect.disabled = true;
    instrumentSelection.disabled = true;
    try {
        await initAudio();
        await playEffectSound('Click.mp3');
        clearTimeout(nextRoundTimer);
        sequence = createSequence(); currentIndex = 0; correct = 0; expectedKey = null;
        activeAnswerKeys = new Set(currentPhases[phaseIndex].progression.map(note => KEY_BY_NOTE[note]));
        if (currentPhases[phaseIndex].outside.length) activeAnswerKeys.add('g');
        startButton.blur();
        answers.classList.add('active');
        status.innerHTML = '<div class="status-line">Carregando sons da fase...</div>';
        let storage = { available: false, persistent: false };
        try {
            storage = await requestPersistentStorage();
        } catch (error) {
            console.warn('Não foi possível solicitar armazenamento persistente.', error);
        }
        if (!storage.persistent) {
            status.innerHTML = '<div class="status-line">O navegador pode limpar o cache e o progresso se o armazenamento não for mantido.</div>';
        }
        await preloadPhaseAudio();
        status.innerHTML = '<div class="status-line">Preparando a fase...</div>';
        await new Promise(resolve => setTimeout(resolve, 500));
        await playShepardTone();
        await new Promise(resolve => setTimeout(resolve, RESPONSE_TIME));
        if (startButton.disabled) playNext();
    } catch (error) {
        finish(error);
    }
}
function renderAnswers() {
    const phase = currentPhases[phaseIndex];
    if (!phase) {
        answers.replaceChildren();
        timer = null;
        return;
    }
    const progression = phase.progression;
    const lightText = new Set(['#991b1b', '#a16207', '#166534', '#2563eb', '#1d4ed8', '#9333ea', '#7e22ce']);
    const hasOutsideNote = phase.outside.length > 0;
    const circleSize = Math.min(window.innerWidth * (window.innerWidth <= 500 ? .96 : .92), 460);
    const radius = progression.length >= 12 ? 38 : 37;
    const neighborSpacing = progression.length <= 1
        ? Infinity
        : circleSize * 2 * (radius / 100) * Math.sin(Math.PI / progression.length);
    const edgeSpacing = circleSize * (0.5 - radius / 100);
    const answerPixels = Math.min(96, neighborSpacing * .86, edgeSpacing * 1.7);
    const answerSize = `${answerPixels}px`;
    answers.innerHTML = `<div class="timer circle-timer" id="timer" aria-hidden="true"></div><div class="note-circle${hasOutsideNote ? ' has-oob' : ''}" style="--answer-size:${answerSize}">${progression.map((note, index) => {
        const color = NOTE_COLORS[NOTES.indexOf(note)];
        const radians = index * (2 * Math.PI / progression.length);
        const x = 50 + radius * Math.sin(radians);
        const y = 50 - radius * Math.cos(radians);
        return `<button type="button" class="answer" style="left:${x}%;top:${y}%;--note-color:${color};--note-text:${lightText.has(color) ? '#fff' : '#111'}" data-key="${KEY_BY_NOTE[note]}" aria-label="${note}, tecla ${KEY_BY_NOTE[note].toUpperCase()}">${note}<span class="answer-key">${KEY_BY_NOTE[note].toUpperCase()}</span></button>`;
    }).join('')}${hasOutsideNote ? '<button type="button" class="answer answer-oob" data-key="g">Fora do tom<span class="answer-key">G</span></button>' : ''}</div>`;
    timer = answers.querySelector('#timer');
}
for (const select of [instrumentSelection, phaseSelect]) {
    select.addEventListener('change', playClickSound);
}
phaseSelect.addEventListener('change', () => {
    if (phaseSelect.disabled) return;
    phaseIndex = Number(phaseSelect.value);
    updatePhaseInfo();
    renderAnswers();
    status.innerHTML = '';
});
instrumentSelection.addEventListener('change', () => {
    selectedInstrument = instrumentSelection.value;
    currentPhases = buildPhases(selectedInstrument);
    loadProgress();
    renderPhaseOptions();
    updatePhaseInfo();
    renderAnswers();
    startButton.disabled = !currentPhases.length;
    status.innerHTML = '';
});
startButton.addEventListener('click', startGame);
themeToggle.addEventListener('click', () => {
    const isDark = !document.body.classList.contains('dark');
    setTheme(isDark);
    writeStorage(THEME_KEY, isDark ? 'dark' : 'light');
});
answers.addEventListener('click', event => {
    event.preventDefault();
    const button = event.target.closest('.answer');
    if (button) {
        processAnswer(button.dataset.key);
        button.blur();
    }
});
document.addEventListener('keydown', event => {
    const key = event.key.toLowerCase();
    const target = event.target;
    const isFormControl = target instanceof HTMLInputElement ||
        target instanceof HTMLSelectElement ||
        target instanceof HTMLTextAreaElement;
    if (isFormControl) return;
    if (key === 'f' && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey &&
        !startButton.disabled) {
        event.preventDefault();
        startGame();
    } else if (waiting && activeAnswerKeys.has(key)) {
        event.preventDefault();
        processAnswer(key);
    }
});
loadTheme();
renderChoices(); renderAnswers();

if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./Worker.js').catch(error => {
            console.warn('Não foi possível ativar o modo offline.', error);
        });
    });
}
