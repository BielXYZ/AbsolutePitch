<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino de Ouvido</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #222; background: #fff; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow-x: hidden; overflow-anchor: none; background: #fff; }
        main { width: min(680px, 92vw); padding: 34px 16px; text-align: center; overflow-anchor: none; }
        .brand { position: relative; margin-bottom: 26px; }
        h1 { margin: 0 0 8px; color: #222; font-size: 1.8rem; font-weight: 700; }
        .subtitle { margin: 0; color: #666; font-size: .95rem; }
        .theme-toggle { position: absolute; top: 0; right: 0; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 1px solid #d0d0d0; border-radius: 50%; background: #f5f5f5; color: #222; cursor: pointer; font-size: 1.15rem; line-height: 1; }
        .theme-toggle:hover, .theme-toggle:focus-visible { border-color: #999; outline: none; }
        .settings { display: grid; gap: 18px; margin-bottom: 22px; }
        .field { display: grid; gap: 8px; }
        .field-title { color: #666; font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
        .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        label, button { font: inherit; }
        .choice { padding: 9px 14px; border: 1px solid #d0d0d0; border-radius: 7px; background: #f5f5f5; color: #222; cursor: pointer; user-select: none; transition: background .15s, border-color .15s; }
        .choice:hover { border-color: #999; }
        .choice:has(input:checked) { background: #222; color: #fff; border-color: #222; }
        .choice input { position: absolute; opacity: 0; pointer-events: none; }
        .primary, .answer { border: 1px solid #ccc; border-radius: 7px; padding: 11px 14px; background: #fff; cursor: pointer; }
        .phase-info { padding: 14px; border: 1px solid #e2e2e2; border-radius: 8px; background: #fafafa; }
        .phase-info strong { display: block; margin-bottom: 5px; color: #222; font-size: 1rem; }
        .phase-info span { color: #666; font-size: .95rem; }
        .primary { width: 100%; margin: 20px 0; background: #222; color: #fff; border-color: #222; font-weight: 700; transition: background .15s; }
        .primary:hover:not(:disabled) { background: #444; }
        .primary:disabled { opacity: .45; cursor: not-allowed; }
        select { width: 100%; padding: 11px 14px; border: 1px solid #d0d0d0; border-radius: 7px; background: #fff; color: #222; font: inherit; }
        select:disabled { background: #f5f5f5; color: #777; }
        #status { min-height: 62px; display: grid; place-items: center; margin: 12px 0; }
        .status-line { color: #666; font-size: .9rem; }
        .result { color: #222; font-size: 1.25rem; font-weight: 700; line-height: 1.6; }
        .error { color: #b00020; font-size: .9rem; }
        .timer { display: none; gap: 8px; margin: 12px 0; }
        .timer.active { display: grid; }
        .bar { height: 8px; overflow: hidden; border-radius: 5px; background: #e5e5e5; }
        #bar-fill { width: 100%; height: 100%; background: #333; transition: width .08s linear; }
        #time-left { color: #666; font-size: .8rem; font-variant-numeric: tabular-nums; }
        .answers { display: none; }
        .answers.active { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: auto; padding: 20px 12px; background: #fff; }
        .note-circle { position: relative; width: min(82vw, 390px); aspect-ratio: 1; margin: 18px auto 8px; border: 2px solid #e5e5e5; border-radius: 50%; background: radial-gradient(circle, #fff 0 30%, #fafafa 31% 100%); }
        .note-circle::after { content: "ESCOLHA"; position: absolute; inset: 42% 0 auto; color: #aaa; font-size: .7rem; font-weight: 700; letter-spacing: .12em; }
        .circle-timer { position: absolute; z-index: 1; top: 50%; left: 50%; width: min(38%, 150px); margin: 0; gap: 5px; transform: translate(-50%, -50%); pointer-events: none; }
        .circle-timer .bar { height: 7px; }
        .circle-timer #time-left { text-align: center; }
        .answer { position: absolute; width: 76px; min-height: 58px; padding: 7px 4px; border: 2px solid var(--note-color); border-radius: 50%; background: var(--note-color); color: var(--note-text); font-weight: 700; cursor: pointer; transform: translate(-50%, -50%); box-shadow: 0 3px 8px rgb(0 0 0 / 14%); transition: transform .12s ease, filter .12s ease; }
        .answer:hover, .answer:focus-visible { filter: brightness(1.12); outline: none; }
        .answer:active { transform: translate(-50%, -50%) scale(.92); }
        .answer-key { display: block; margin-top: 3px; font-size: .68rem; opacity: .8; }
        .answer-oob { position: static; display: block; width: min(100%, 260px); min-height: auto; margin: 12px auto 0; border-radius: 7px; background: #f2f2f2; border-color: #aaa; color: #444; transform: none; }
        .answer-oob:active { transform: scale(.96); }
        body.dark { color: #eee; background: #181818; }
        body.dark h1, body.dark .phase-info strong, body.dark .result { color: #f5f5f5; }
        body.dark .subtitle, body.dark .field-title, body.dark .phase-info span, body.dark .status-line, body.dark #time-left { color: #aaa; }
        body.dark .theme-toggle, body.dark .choice { border-color: #4a4a4a; background: #292929; color: #eee; }
        body.dark .choice:hover, body.dark .theme-toggle:hover, body.dark .theme-toggle:focus-visible { border-color: #777; }
        body.dark .choice:has(input:checked), body.dark .primary { background: #f5f5f5; color: #181818; border-color: #f5f5f5; }
        body.dark .primary:hover:not(:disabled) { background: #d8d8d8; }
        body.dark select { border-color: #4a4a4a; background: #292929; color: #eee; }
        body.dark select:disabled { background: #222; color: #888; }
        body.dark .phase-info { border-color: #3a3a3a; background: #222; }
        body.dark .answers.active { background: #181818; }
        body.dark .note-circle { border-color: #3a3a3a; background: radial-gradient(circle, #222 0 30%, #1d1d1d 31% 100%); }
        body.dark .answer-oob { background: #292929; border-color: #666; color: #eee; }
        body.dark .bar { background: #3a3a3a; }
        body.dark #bar-fill { background: #ddd; }
        @media (max-width: 500px) { main { padding: 24px 14px; } .answer { width: 64px; min-height: 52px; font-size: .85rem; } .choice { padding: 8px 11px; font-size: .88rem; } }
    </style>
</head>
<body>
<main>
    <header class="brand">
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Ativar modo escuro" aria-pressed="false"><span aria-hidden="true">☾</span></button>
        <h1>Treino de Ouvido</h1>
        <p class="subtitle">Desenvolva seu ouvido absoluto, uma nota por vez.</p>
    </header>

    <section class="settings" aria-label="Configurações">
        <div class="field">
            <div class="field-title">Fase</div>
            <select id="phase-select" aria-label="Escolher fase"></select>
            <div class="phase-info" id="phase-info"></div>
        </div>
        <div class="field">
            <div class="field-title">Oitavas</div>
            <div class="choices" id="octave-selection"></div>
        </div>
        <div class="field">
            <div class="field-title">Instrumento</div>
            <div class="choices" id="instrument-selection"></div>
        </div>
    </section>

    <button type="button" class="primary" id="start">Iniciar fase</button>
    <div id="status"></div>
    <div class="answers" id="answers"></div>
</main>

<script>
const NOTES = ['Dó', 'Dó#', 'Ré', 'Ré#', 'Mi', 'Fá', 'Fá#', 'Sol', 'Sol#', 'Lá', 'Lá#', 'Si'];
const NOTE_COLORS = ['#ef4444', '#991b1b', '#f59e0b', '#a16207', '#facc15', '#22c55e', '#166534', '#22d3ee', '#2563eb', '#1d4ed8', '#9333ea', '#7e22ce'];
const NOTE_TO_MIDI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const KEY_BY_NOTE = { 'Dó': 'q', 'Dó#': 'w', 'Ré': 'e', 'Ré#': 'r', 'Mi': 'c', 'Fá': 'v', 'Fá#': 'n', 'Sol': 'm', 'Sol#': 'u', 'Lá': 'i', 'Lá#': 'o', 'Si': 'p' };
const PHASES = [
    [['Dó'], ['Ré']], [['Dó'], ['Ré', 'Mi']], [['Dó', 'Ré'], ['Mi', 'Fá']],
    [['Dó', 'Ré'], ['Mi', 'Fá', 'Sol']], [['Dó', 'Ré', 'Mi'], ['Fá', 'Sol', 'Lá']],
    [['Dó', 'Ré', 'Mi'], ['Fá', 'Sol', 'Lá', 'Si']], [['Dó', 'Ré', 'Mi', 'Fá'], ['Sol', 'Lá', 'Si']],
    [['Dó', 'Ré', 'Mi', 'Fá', 'Sol'], ['Lá', 'Si']], [['Dó', 'Ré', 'Mi', 'Fá', 'Sol', 'Lá'], ['Si']],
    [['Dó', 'Ré', 'Mi', 'Fá', 'Sol', 'Lá', 'Si'], []],
    [['Dó', 'Ré', 'Mi', 'Fá', 'Sol', 'Lá', 'Si'], ['Dó#']],
    [['Dó', 'Ré', 'Mi', 'Fá', 'Sol', 'Lá', 'Si'], ['Dó#', 'Ré#']],
    [['Dó', 'Ré', 'Mi', 'Fá', 'Sol', 'Lá', 'Si'], ['Dó#', 'Ré#', 'Fá#']],
    [['Dó', 'Ré', 'Mi', 'Fá', 'Sol', 'Lá', 'Si'], ['Dó#', 'Ré#', 'Fá#', 'Sol#']],
    [['Dó', 'Ré', 'Mi', 'Fá', 'Sol', 'Lá', 'Si'], ['Dó#', 'Ré#', 'Fá#', 'Sol#', 'Lá#']],
    [['Dó', 'Dó#', 'Ré', 'Mi', 'Fá', 'Sol', 'Lá', 'Si'], ['Ré#', 'Fá#', 'Sol#', 'Lá#']],
    [['Dó', 'Dó#', 'Ré', 'Ré#', 'Mi', 'Fá', 'Sol', 'Lá', 'Si'], ['Fá#', 'Sol#', 'Lá#']],
    [['Dó', 'Dó#', 'Ré', 'Ré#', 'Mi', 'Fá', 'Fá#', 'Sol', 'Lá', 'Si'], ['Sol#', 'Lá#']],
    [['Dó', 'Dó#', 'Ré', 'Ré#', 'Mi', 'Fá', 'Fá#', 'Sol', 'Sol#', 'Lá', 'Si'], ['Lá#']],
    [['Dó', 'Dó#', 'Ré', 'Ré#', 'Mi', 'Fá', 'Fá#', 'Sol', 'Sol#', 'Lá', 'Lá#', 'Si'], []]
];
const INSTRUMENTS = {
    piano: ['Piano', 21, 108], 'bass-electric': ['Baixo elétrico', 34, 67], bassoon: ['Fagote', 45, 69],
    cello: ['Violoncelo', 41, 71], clarinet: ['Clarinete', 58, 90], contrabass: ['Contrabaixo', 45, 56],
    flute: ['Flauta', 69, 88], 'french-horn': ['Trompa', 22, 43], 'guitar-acoustic': ['Violão acústico', 45, 68],
    'guitar-electric': ['Guitarra elétrica', 45, 78], 'guitar-nylon': ['Violão nylon', 45, 80],
    harmonium: ['Harmônio', 45, 68], harp: ['Harpa', 45, 79], organ: ['Órgão', 21, 78],
    saxophone: ['Saxofone', 69, 80], trombone: ['Trombone', 34, 56], trumpet: ['Trompete', 57, 67],
    tuba: ['Tuba', 34, 53], violin: ['Violino', 57, 91], xylophone: ['Xilofone', 60, 91]
};
const SAMPLES = {
    'bass-electric': 'As1 As2 As3 As4 Cs1 Cs2 Cs3 Cs4 Cs5 E1 E2 E3 E4 G1 G2 G3 G4',
    bassoon: 'A2 G2 C3 A3 G3 C4 E4 A4 G4 C5', cello: 'A2 A3 A4 As2 As3 B2 B3 B4 C2 C3 C4 C5 Cs3 Cs4 D2 D3 D4 Ds2 Ds3 Ds4 E2 E3 E4 F2 F3 F4 Fs3 Fs4 G2 G3 G4 Gs2 Gs3 Gs4',
    clarinet: 'D3 F3 As3 D4 F4 As4 D5 F5 As5 D6 Fs6', contrabass: 'A2 As1 B3 C2 Cs3 D2 E2 E3 Fs1 Fs2 G1 Gs2 Gs3',
    flute: 'C4 E4 A4 C5 E5 A5 C6 E6 A6 C7', 'french-horn': 'A1 C2 Ds2 G2 D3 F3 A3 C4 D5 F5',
    'guitar-acoustic': 'D2 Ds2 E2 F2 Fs2 G2 Gs2 A2 As2 B2 C3 Cs3 D3 Ds3 E3 F3 Fs3 G3 Gs3 A3 As3 B3 C4 Cs4 D4 Ds4 E4 F4 Fs4 G4 Gs4 A4 As4 B4 C5 Cs5 D5',
    'guitar-electric': 'A2 A3 A4 A5 C3 C4 C5 C6 Cs2 Ds3 Ds4 Ds5 E2 Fs2 Fs3 Fs4 Fs5',
    'guitar-nylon': 'A2 A3 A4 A5 As5 B1 B2 B3 B4 Cs3 Cs4 Cs5 D2 D3 D5 Ds4 E2 E3 E4 E5 Fs2 Fs3 Fs4 Fs5 G3 G5 Gs2 Gs4 Gs5',
    harmonium: 'A2 A3 A4 As2 As3 As4 B2 B3 B4 C2 C3 C4 C5 Cs2 Cs3 Cs4 Cs5 D2 D3 D4 D5 Ds2 Ds3 Ds4 E2 E3 E4 F2 F3 F4 Fs2 Fs3 G2 G3 G4 Gs2 Gs3 Gs4',
    harp: 'A2 A4 A6 B1 B3 B5 B6 C3 C5 D2 D4 D6 D7 E1 E3 E5 F2 F4 F6 F7 G1 G3 G5',
    organ: 'C1 Ds1 Fs1 A1 C2 Ds2 Fs2 A2 C3 Ds3 Fs3 A3 C4 Ds4 Fs4 A4 C5 Ds5 Fs5 A5 C6',
    piano: 'A1 As1 B1 C1 Cs1 D1 Ds1 E1 F1 Fs1 G1 Gs1 A2 As2 B2 C2 Cs2 D2 Ds2 E2 F2 Fs2 G2 Gs2 A3 As3 B3 C3 Cs3 D3 Ds3 E3 F3 Fs3 G3 Gs3 A4 As4 B4 C4 Cs4 D4 Ds4 E4 F4 Fs4 G4 Gs4 A5 As5 B5 C5 Cs5 D5 Ds5 E5 F5 Fs5 G5 Gs5 A6 As6 B6 C6 Cs6 D6 Ds6 E6 F6 Fs6 G6 Gs6 A7 As7 B7 C7 Cs7 D7 Ds7 E7 F7 Fs7 G7 Gs7 C8',
    saxophone: 'A4 A5 As3 As4 B3 B4 C4 C5 Cs3 Cs4 Cs5 D3 D4 D5 Ds3 Ds4 Ds5 E3 E4 E5 F3 F4 F5 Fs3 Fs4 Fs5 G3 G4 G5 Gs3 Gs4 Gs5',
    trombone: 'As1 As2 As3 C3 C4 Cs2 Cs4 D3 D4 Ds2 Ds3 Ds4 F2 F3 F4 Gs2 Gs3',
    trumpet: 'F3 A3 C4 Ds4 F4 G4 As4 D5 F5 A5 C6', tuba: 'F1 As1 F2 As2 Ds2 F3 As3 D3 D4',
    violin: 'G3 A3 C4 E4 G4 A4 C5 E5 G5 A5 C6 E6 G6 A6 C7', xylophone: 'G4 C5 G5 C6 G6 C7 G7 C8'
};
const phaseSelect = document.querySelector('#phase-select'), phaseInfo = document.querySelector('#phase-info');
const octaveSelection = document.querySelector('#octave-selection'), instrumentSelection = document.querySelector('#instrument-selection');
const startButton = document.querySelector('#start'), status = document.querySelector('#status');
const themeToggle = document.querySelector('#theme-toggle');
let timer, barFill, timeLeft;
const answers = document.querySelector('#answers');
const audioBuffers = {}, sampleMaps = {}, sampleCandidates = {}, notePoolCache = new Map();
const RESPONSE_TIME = 2000, ROUND_SIZE = 20, HALF_ROUND = ROUND_SIZE / 2, PASS_SCORE = 18;
const FIRST_MIDI = 21, LAST_MIDI = 108, OCTAVE_COUNT = 8, SHEPARD_DURATION = 7;
let audioContext, currentSource, sequence = [], currentIndex = 0, correct = 0;
let phaseIndex = 0, highestUnlockedPhase = 0, expectedKey = null, waiting = false, timerId, nextRoundTimer;
let roundDeadline = 0;
let activeAnswerKeys = new Set();
let shepardSources = [];
let selectedInstrument = 'piano';
let lockedScrollY = 0;
const PROGRESS_KEY = 'absolute-pitch-highest-phase';
const THEME_KEY = 'absolute-pitch-theme';

function setTheme(isDark) {
    document.body.classList.toggle('dark', isDark);
    themeToggle.setAttribute('aria-pressed', String(isDark));
    themeToggle.setAttribute('aria-label', isDark ? 'Ativar modo claro' : 'Ativar modo escuro');
    themeToggle.querySelector('span').textContent = isDark ? '☀' : '☾';
}
function loadTheme() {
    setTheme(localStorage.getItem(THEME_KEY) === 'dark');
}

function renderChoices() {
    loadProgress();
    renderPhaseOptions();
    instrumentSelection.innerHTML = Object.entries(INSTRUMENTS).map(([value, [label]]) =>
        `<label class="choice"><input class="instrument" type="radio" name="instrument" value="${value}"${value === 'piano' ? ' checked' : ''}>${label}</label>`
    ).join('');
    renderOctaveChoices();
    updatePhaseInfo();
}
function availableOctaves(instrument) {
    const [, min, max] = INSTRUMENTS[instrument];
    return Array.from({ length: OCTAVE_COUNT }, (_, index) => index + 1).filter(octave => {
        const firstMidi = (octave + 1) * 12;
        return firstMidi <= max && firstMidi + 11 >= min;
    });
}
function renderOctaveChoices() {
    const instrument = document.querySelector('.instrument:checked')?.value || 'piano';
    octaveSelection.innerHTML = availableOctaves(instrument).map(octave =>
        `<label class="choice"><input class="octave" type="checkbox" value="${octave}" checked>${octave}</label>`
    ).join('');
}
function loadProgress() {
    const saved = Number.parseInt(localStorage.getItem(PROGRESS_KEY), 10);
    highestUnlockedPhase = Number.isInteger(saved) ? Math.min(Math.max(saved, 0), PHASES.length - 1) : 0;
    phaseIndex = highestUnlockedPhase;
}
function saveProgress() {
    localStorage.setItem(PROGRESS_KEY, String(highestUnlockedPhase));
}
function renderPhaseOptions() {
    phaseSelect.innerHTML = PHASES.map((_, index) => {
        const locked = index > highestUnlockedPhase;
        return `<option value="${index}" ${index === phaseIndex ? 'selected' : ''} ${locked ? 'disabled' : ''}>Fase ${index + 1}${locked ? ' (bloqueada)' : ''}</option>`;
    }).join('');
}
function updatePhaseInfo() {
    const [progression, outside] = PHASES[phaseIndex];
    phaseInfo.innerHTML = `<strong>Fase ${phaseIndex + 1} de ${PHASES.length}: ${ROUND_SIZE} notas</strong><span>Progressão: ${progression.join(', ') || 'nenhuma'}${outside.length ? ` · Fora: ${outside.join(', ')}` : ' · Sem notas fora do tom'}</span>`;
}
function shuffle(values) {
    for (let index = values.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [values[index], values[swapIndex]] = [values[swapIndex], values[index]];
    }
    return values;
}
function midiDetails(midi) {
    return { pitchClass: NOTES[midi % 12], octave: Math.floor((midi - 12) / 12) };
}
function noteToMidi(name) {
    const match = name.match(/^([A-G])s?(\d)$/); if (!match) return null;
    return (Number(match[2]) + 1) * 12 + NOTE_TO_MIDI[match[1]] + (name.includes('s') ? 1 : 0);
}
function sampleMap(instrument) {
    if (!sampleMaps[instrument]) {
        sampleMaps[instrument] = SAMPLES[instrument].split(' ').reduce((map, name) => {
            map[noteToMidi(name)] = name;
            return map;
        }, {});
        sampleCandidates[instrument] = Object.keys(sampleMaps[instrument]).map(Number);
    }
    return sampleMaps[instrument];
}
function playableMidi(midi, instrument) { const [, min, max] = INSTRUMENTS[instrument]; return midi >= min && midi <= max; }
async function getBuffer(midi, instrument) {
    if (location.protocol === 'file:') throw new Error('Abra o site por um servidor local para carregar os samples.');
    audioBuffers[instrument] ||= {};
    const map = sampleMap(instrument);
    const nearest = sampleCandidates[instrument].reduce((closest, candidate) => {
        return Math.abs(midi - candidate) < Math.abs(midi - closest) ? candidate : closest;
    });
    const sampleName = map[nearest];
    if (!audioBuffers[instrument][sampleName]) {
        const response = await fetch(`./Samples/${instrument}/${sampleName}.wav`);
        if (!response.ok) throw new Error(`Não foi possível carregar ${sampleName}.wav (${response.status}).`);
        audioBuffers[instrument][sampleName] = await audioContext.decodeAudioData(await response.arrayBuffer());
    }
    return { buffer: audioBuffers[instrument][sampleName], semitoneDiff: midi - nearest };
}
async function initAudio() {
    const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextConstructor) throw new Error('Seu navegador não oferece suporte a áudio.');
    audioContext ||= new AudioContextConstructor();
    if (audioContext.state === 'suspended') await audioContext.resume();
}
function playShepardTone() {
    const start = audioContext.currentTime + .04;
    const duration = SHEPARD_DURATION;
    const master = audioContext.createGain();
    master.gain.setValueAtTime(.28, start);
    master.connect(audioContext.destination);
    shepardSources = [];

    for (let octave = 0; octave < 5; octave++) {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const lowFrequency = 130.81 * 2 ** octave;
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(lowFrequency, start);
        oscillator.frequency.exponentialRampToValueAtTime(lowFrequency * 2, start + duration);
        gain.gain.setValueAtTime(octave === 0 || octave === 4 ? .035 : .075, start);
        oscillator.connect(gain).connect(master);
        oscillator.start(start);
        oscillator.stop(start + duration + .05);
        shepardSources.push(oscillator);
    }
    return new Promise(resolve => setTimeout(() => {
        shepardSources = [];
        resolve();
    }, duration * 1000));
}
function lockPagePosition() {
    lockedScrollY = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${lockedScrollY}px`;
    document.body.style.left = '0';
    document.body.style.right = '0';
}
function unlockPagePosition() {
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    window.scrollTo(0, lockedScrollY);
}
function availableNotes(notes, octaves, instrument) {
    const key = `${instrument}|${octaves.join(',')}|${notes.join(',')}`;
    if (notePoolCache.has(key)) return notePoolCache.get(key);
    const pool = Array.from({ length: LAST_MIDI - FIRST_MIDI + 1 }, (_, index) => index + FIRST_MIDI).filter(midi => {
        const details = midiDetails(midi); return octaves.includes(details.octave) && notes.includes(details.pitchClass) && playableMidi(midi, instrument);
    });
    notePoolCache.set(key, pool);
    return pool;
}
function createSequence() {
    const [progression, outside] = PHASES[phaseIndex];
    const selectedOctaves = [...document.querySelectorAll('.octave:checked')].map(input => Number(input.value));
    selectedInstrument = document.querySelector('.instrument:checked')?.value;
    if (!selectedOctaves.length || !selectedInstrument) {
        throw new Error('Escolha ao menos uma oitava e um instrumento para iniciar.');
    }
    const valid = availableNotes(progression, selectedOctaves, selectedInstrument);
    const out = availableNotes(outside, selectedOctaves, selectedInstrument);
    if (!valid.length || (outside.length && !out.length)) throw new Error('A combinação escolhida não possui samples disponíveis para esta fase.');
    const targets = outside.length
        ? [...Array(HALF_ROUND).fill('valid'), ...Array(HALF_ROUND).fill('outside')]
        : Array(ROUND_SIZE).fill('valid');
    return shuffle(targets).map(type => {
        const pool = type === 'valid' ? valid : out;
        return { midi: pool[Math.floor(Math.random() * pool.length)], outside: type === 'outside' };
    });
}
async function playNext() {
    if (currentIndex >= sequence.length) return finish();
    cancelAnimationFrame(timerId);
    timer.classList.remove('active');
    const target = sequence[currentIndex++];
    const details = midiDetails(target.midi);
    expectedKey = target.outside ? 'g' : KEY_BY_NOTE[details.pitchClass];
    status.innerHTML = `<div class="status-line">Nota ${currentIndex} / ${ROUND_SIZE}</div>`;
    try {
        const sample = await getBuffer(target.midi, selectedInstrument);
        currentSource = audioContext.createBufferSource();
        const gain = audioContext.createGain();
        currentSource.buffer = sample.buffer;
        currentSource.playbackRate.value = 2 ** (sample.semitoneDiff / 12);
        gain.gain.setValueAtTime(1, audioContext.currentTime); gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + 2);
        currentSource.connect(gain).connect(audioContext.destination); currentSource.start();
    } catch (error) { finish(error); return; }
    waiting = true; timer.classList.add('active');
    barFill.style.width = '100%';
    timeLeft.textContent = `${(RESPONSE_TIME / 1000).toFixed(1)}s`;
    const started = performance.now();
    roundDeadline = started + RESPONSE_TIME;
    function tick() {
        const remaining = Math.max(0, RESPONSE_TIME - (performance.now() - started));
        barFill.style.width = `${remaining / RESPONSE_TIME * 100}%`; timeLeft.textContent = `${(remaining / 1000).toFixed(1)}s`;
        if (remaining) timerId = requestAnimationFrame(tick); else processAnswer(null);
    }
    timerId = requestAnimationFrame(tick);
}
function processAnswer(key) {
    if (!waiting || (key !== null && !activeAnswerKeys.has(key))) return;
    waiting = false;
    if (key !== null && key === expectedKey) correct++;
    if (key === null) {
        playNext();
        return;
    }
    cancelAnimationFrame(timerId);
    timer.classList.remove('active');
    nextRoundTimer = setTimeout(playNext, Math.max(0, roundDeadline - performance.now()));
}
function finish(error) {
    waiting = false; expectedKey = null; cancelAnimationFrame(timerId); clearTimeout(nextRoundTimer);
    timer.classList.remove('active'); startButton.disabled = false; phaseSelect.disabled = false; answers.classList.remove('active');
    unlockPagePosition();
    activeAnswerKeys.clear();
    shepardSources.forEach(source => { try { source.stop(); } catch (_) {} });
    shepardSources = [];
    if (currentSource) { try { currentSource.stop(); } catch (_) {} currentSource = null; }
    if (error) { status.innerHTML = `<div class="error">${error.message}</div>`; return; }
    const percentage = Math.round(correct / ROUND_SIZE * 100);
    if (correct >= PASS_SCORE) {
        if (phaseIndex === highestUnlockedPhase && highestUnlockedPhase < PHASES.length - 1) {
            highestUnlockedPhase++;
            saveProgress();
            phaseIndex = highestUnlockedPhase;
            renderPhaseOptions();
            updatePhaseInfo();
            renderAnswers();
            status.innerHTML = `<div class="result">${correct} / ${ROUND_SIZE} (${percentage}%)<br>Fase concluída! Próxima: fase ${phaseIndex + 1}.</div>`;
        } else if (phaseIndex === PHASES.length - 1) {
            saveProgress();
            status.innerHTML = `<div class="result">${correct} / ${ROUND_SIZE} (${percentage}%)<br>Parabéns! Você concluiu todas as fases.</div>`;
        } else {
            status.innerHTML = `<div class="result">${correct} / ${ROUND_SIZE} (${percentage}%)<br>Fase concluída. Você pode escolher outra fase desbloqueada.</div>`;
        }
        return;
    }
    status.innerHTML = `<div class="result">${correct} / ${ROUND_SIZE} (${percentage}%)<br>Você precisa de ${PASS_SCORE} acertos. Tente a fase novamente.</div>`;
}
async function startGame() {
    try {
        await initAudio();
        clearTimeout(nextRoundTimer);
        sequence = createSequence(); currentIndex = 0; correct = 0; expectedKey = null;
        activeAnswerKeys = new Set(PHASES[phaseIndex][0].map(note => KEY_BY_NOTE[note]));
        if (PHASES[phaseIndex][1].length) activeAnswerKeys.add('g');
        startButton.blur();
        lockPagePosition();
        startButton.disabled = true; phaseSelect.disabled = true; answers.classList.add('active');
        status.innerHTML = '<div class="status-line">Preparando a fase...</div>';
        await playShepardTone();
        await new Promise(resolve => setTimeout(resolve, RESPONSE_TIME));
        if (startButton.disabled) playNext();
    } catch (error) {
        finish(error);
    }
}
function renderAnswers() {
    const progression = PHASES[phaseIndex][0];
    const lightText = new Set(['#991b1b', '#a16207', '#166534', '#2563eb', '#1d4ed8', '#9333ea', '#7e22ce']);
    answers.innerHTML = `<div class="note-circle"><div class="timer circle-timer" id="timer"><div class="bar"><div id="bar-fill"></div></div><span id="time-left"></span></div>${progression.map((note, index) => {
        const color = NOTE_COLORS[NOTES.indexOf(note)];
        const radians = index * (2 * Math.PI / progression.length);
        const x = 50 + 37 * Math.sin(radians);
        const y = 50 - 37 * Math.cos(radians);
        return `<button type="button" class="answer" style="left:${x}%;top:${y}%;--note-color:${color};--note-text:${lightText.has(color) ? '#fff' : '#111'}" data-key="${KEY_BY_NOTE[note]}" aria-label="${note}, tecla ${KEY_BY_NOTE[note].toUpperCase()}">${note}<span class="answer-key">${KEY_BY_NOTE[note].toUpperCase()}</span></button>`;
    }).join('')}</div>${PHASES[phaseIndex][1].length ? '<button class="answer answer-oob" data-key="g">Fora do tom <span class="answer-key">G</span></button>' : ''}`;
    timer = answers.querySelector('#timer');
    barFill = answers.querySelector('#bar-fill');
    timeLeft = answers.querySelector('#time-left');
}
phaseSelect.addEventListener('change', () => {
    if (phaseSelect.disabled) return;
    phaseIndex = Number(phaseSelect.value);
    updatePhaseInfo();
    renderAnswers();
    status.innerHTML = '';
});
instrumentSelection.addEventListener('change', renderOctaveChoices);
startButton.addEventListener('click', startGame);
themeToggle.addEventListener('click', () => {
    const isDark = !document.body.classList.contains('dark');
    setTheme(isDark);
    localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
});
answers.addEventListener('click', event => {
    event.preventDefault();
    const button = event.target.closest('.answer');
    if (button) {
        processAnswer(button.dataset.key);
        button.blur();
    }
});
document.addEventListener('keydown', event => {
    const key = event.key.toLowerCase();
    if (key === 'f' && !startButton.disabled) {
        event.preventDefault();
        startGame();
    } else if (waiting && activeAnswerKeys.has(key)) {
        event.preventDefault();
        processAnswer(key);
    }
});
loadTheme();
renderChoices(); renderAnswers();
</script>
